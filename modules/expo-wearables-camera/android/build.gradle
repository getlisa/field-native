apply plugin: 'com.android.library'

group = 'expo.modules.wearablescamera'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use managed SDK versions from expo-modules-core, set this true.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 29)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.wearablescamera"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.activity:activity-ktx:1.9.0"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
  implementation "com.meta.wearable:mwdat-core:0.3.0"
  implementation "com.meta.wearable:mwdat-camera:0.3.0"
  // Add this only if you actually use the mock device APIs:
  // implementation "com.meta.wearable:mwdat-mockdevice:0.3.0"
}
